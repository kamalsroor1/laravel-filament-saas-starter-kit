services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php-fpm:
        condition: service_started
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  php-fpm:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/saas-starter-kit}:latest
    container_name: php-fpm
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  horizon:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/saas-starter-kit}:latest
    container_name: horizon
    working_dir: /var/www/html
    command: php artisan horizon
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  scheduler:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/saas-starter-kit}:latest
    container_name: scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  reverb:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/saas-starter-kit}:latest
    container_name: reverb
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  minio_data: